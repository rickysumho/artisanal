{{ define "main" }}
  <div class="page-shell page-content">
    <article class="page-measure prose">
      <header class="page-header">
        <h1 class="page-title">{{ .Title }}</h1>
        {{ with .Params.subtitle }}<p class="page-subtitle">{{ . }}</p>{{ end }}
      </header>
      {{ .Content }}
    </article>
  </div>
{{ end }}
