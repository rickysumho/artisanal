<!doctype html>
<html lang="{{ site.Language.Locale | default site.Language.Lang | default "en" }}" dir="{{ site.Language.Direction | default "ltr" }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body class="site {{ printf "kind-%s type-%s" .Kind .Type }}">
    <a class="skip-link" href="#main-content">{{ i18n "skip_to_content" }}</a>
    <header class="site-header">
      {{ partial "header.html" . }}
    </header>
    <main id="main-content" class="site-main" tabindex="-1">
      {{ block "main" . }}{{ end }}
    </main>
    {{ with site.Params.artisanal.social }}
      <footer class="site-footer">
        {{ partial "footer.html" $ }}
      </footer>
    {{ end }}
  </body>
</html>
